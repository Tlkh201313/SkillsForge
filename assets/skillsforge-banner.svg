<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">SkillsForge</title>
  <desc id="description">SkillsForge banner: Work OS for productive Agent Skills - route, workflows, library, multi-host ship; trust as the safety layer.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b18"/>
      <stop offset="0.52" stop-color="#111936"/>
      <stop offset="1" stop-color="#17102f"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.48" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1035" cy="32" r="180" fill="#7c3aed" opacity="0.10"/>
  <circle cx="70" cy="300" r="170" fill="#06b6d4" opacity="0.08"/>

  <g transform="translate(86 59)" filter="url(#glow)">
    <path d="M100 0 187 50v100l-87 50-87-50V50Z" fill="#0b1126" stroke="url(#metal)" stroke-width="7"/>
    <path d="m55 100 29 29 61-66" fill="none" stroke="url(#metal)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M168 17l10-16m8 34 19-5m-24 27 14 12" fill="none" stroke="url(#spark)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g fill="#f8fafc" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="330" y="132" font-size="72" font-weight="760" letter-spacing="-2">SkillsForge</text>
    <text x="334" y="182" font-size="24" font-weight="500" fill="#cbd5e1">Work OS for productive Agent Skills</text>
    <text x="334" y="222" font-size="17" fill="#94a3b8">Skills -> route -> workflows -> library -> ship across AI CLIs</text>
    <text x="334" y="255" font-size="15" fill="#64748b">367 skills - 100 workflows - trust safety layer built in</text>
  </g>
  <rect x="334" y="275" width="92" height="3" rx="2" fill="#67e8f9"/>
  <rect x="434" y="275" width="58" height="3" rx="2" fill="#818cf8"/>
  <rect x="500" y="275" width="32" height="3" rx="2" fill="#c084fc"/>
</svg>
