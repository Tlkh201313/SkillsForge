<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-labelledby="title description">
  <title id="title">SkillsForge trust safety layer</title>
  <desc id="description">Safety layer under the Work OS: validate, deny unsafe, package safe, PreToolUse guard, tamper-evident receipt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b18"/>
      <stop offset="1" stop-color="#111936"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="140" rx="16" fill="url(#bg)"/>
  <rect x="24" y="66" width="1152" height="3" rx="1.5" fill="url(#accent)" opacity="0.45"/>

  <!-- Step 1 -->
  <circle cx="120" cy="68" r="18" fill="#0b1126" stroke="#67e8f9" stroke-width="3"/>
  <text x="120" y="74" text-anchor="middle" fill="#67e8f9" font-size="16" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif">1</text>
  <text x="120" y="108" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600" font-family="ui-sans-serif, system-ui, sans-serif">Validate</text>
  <text x="120" y="126" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif">structure + policy</text>

  <!-- Step 2 -->
  <circle cx="360" cy="68" r="18" fill="#0b1126" stroke="#fb7185" stroke-width="3"/>
  <text x="360" y="74" text-anchor="middle" fill="#fb7185" font-size="16" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif">2</text>
  <text x="360" y="108" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600" font-family="ui-sans-serif, system-ui, sans-serif">Deny unsafe</text>
  <text x="360" y="126" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif">fail closed</text>

  <!-- Step 3 -->
  <circle cx="600" cy="68" r="18" fill="#0b1126" stroke="#818cf8" stroke-width="3"/>
  <text x="600" y="74" text-anchor="middle" fill="#818cf8" font-size="16" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif">3</text>
  <text x="600" y="108" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600" font-family="ui-sans-serif, system-ui, sans-serif">Package safe</text>
  <text x="600" y="126" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif">Codex plugin</text>

  <!-- Step 4 -->
  <circle cx="840" cy="68" r="18" fill="#0b1126" stroke="#c084fc" stroke-width="3"/>
  <text x="840" y="74" text-anchor="middle" fill="#c084fc" font-size="16" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif">4</text>
  <text x="840" y="108" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600" font-family="ui-sans-serif, system-ui, sans-serif">PreToolUse</text>
  <text x="840" y="126" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif">host guardrail</text>

  <!-- Step 5 -->
  <circle cx="1080" cy="68" r="18" fill="#0b1126" stroke="#34d399" stroke-width="3"/>
  <text x="1080" y="74" text-anchor="middle" fill="#34d399" font-size="16" font-weight="700" font-family="ui-sans-serif, system-ui, sans-serif">5</text>
  <text x="1080" y="108" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600" font-family="ui-sans-serif, system-ui, sans-serif">Receipt</text>
  <text x="1080" y="126" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="ui-sans-serif, system-ui, sans-serif">tamper-evident</text>
</svg>
