<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">SkillsForge star map</title>
  <desc id="desc">A factual map of SkillsForge as a productivity Work OS: skills, packs, profiles, workflows, agents, command shims, hosts, MCP, and PowerShell helpers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.52" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#f7f3ff"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.45" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .sans{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
      .ink{fill:#0f172a}
      .muted{fill:#475569}
      .soft{fill:#64748b}
      .panel{fill:#ffffff;stroke:#dbe3ee;stroke-width:1.5}
      .node{fill:#ffffff;stroke:#dbe3ee;stroke-width:1.5}
      .line{fill:none;stroke:#94a3b8;stroke-width:2.3}
      .blue{fill:#eff6ff;stroke:#bfdbfe}
      .green{fill:#ecfdf5;stroke:#bbf7d0}
      .violet{fill:#f5f3ff;stroke:#ddd6fe}
      .amber{fill:#fffbeb;stroke:#fde68a}
    </style>
  </defs>

  <rect width="1400" height="760" fill="url(#bg)"/>
  <g opacity="0.6">
    <circle cx="104" cy="82" r="2.2" fill="#2563eb"/>
    <circle cx="242" cy="626" r="2.2" fill="#22c55e"/>
    <circle cx="1252" cy="108" r="2.2" fill="#7c3aed"/>
    <circle cx="1188" cy="660" r="2.2" fill="#0ea5e9"/>
    <circle cx="708" cy="52" r="2.2" fill="#22c55e"/>
    <circle cx="642" cy="706" r="2.2" fill="#2563eb"/>
  </g>

  <rect x="66" y="44" width="1268" height="672" rx="30" fill="#ffffff" stroke="#dbe3ee" filter="url(#shadow)"/>

  <g class="sans">
    <text x="700" y="92" text-anchor="middle" class="ink" font-size="36" font-weight="850">SkillsForge star map</text>
    <text x="700" y="124" text-anchor="middle" class="muted" font-size="16">Current repo inventory, generated from committed catalog and plugin files.</text>
  </g>

  <g>
    <path class="line" d="M350 238 C440 278 510 328 584 368"/>
    <path class="line" d="M350 390 C442 386 504 382 584 382"/>
    <path class="line" d="M350 542 C446 492 514 438 584 396"/>
    <path class="line" d="M816 368 C894 308 980 270 1050 238"/>
    <path class="line" d="M816 382 C908 382 978 386 1050 390"/>
    <path class="line" d="M816 396 C894 452 976 506 1050 542"/>
  </g>

  <g transform="translate(584 306)" class="sans">
    <rect x="0" y="0" width="232" height="152" rx="28" fill="url(#core)"/>
    <text x="116" y="58" text-anchor="middle" fill="#ffffff" font-size="33" font-weight="850">SkillsForge</text>
    <text x="116" y="88" text-anchor="middle" fill="#dbeafe" font-size="16" font-weight="650">Productivity Work OS</text>
    <text x="116" y="120" text-anchor="middle" fill="#f8fafc" font-size="14" class="mono">route | lib | auto | ship</text>
  </g>

  <g class="sans">
    <g transform="translate(130 178)">
      <rect class="node blue" width="220" height="120" rx="18"/>
      <text x="110" y="46" text-anchor="middle" class="ink" font-size="28" font-weight="850">511 skills</text>
      <text x="110" y="76" text-anchor="middle" class="muted" font-size="15">28 packs, 11 profiles</text>
      <text x="110" y="100" text-anchor="middle" class="soft mono" font-size="12">SKILL.md + sidecar</text>
    </g>
    <g transform="translate(130 330)">
      <rect class="node green" width="220" height="120" rx="18"/>
      <text x="110" y="46" text-anchor="middle" class="ink" font-size="28" font-weight="850">100 workflows</text>
      <text x="110" y="76" text-anchor="middle" class="muted" font-size="15">dry-run catalog</text>
      <text x="110" y="100" text-anchor="middle" class="soft mono" font-size="12">recommend | show | run</text>
    </g>
    <g transform="translate(130 482)">
      <rect class="node violet" width="220" height="120" rx="18"/>
      <text x="110" y="46" text-anchor="middle" class="ink" font-size="28" font-weight="850">98 agents</text>
      <text x="110" y="76" text-anchor="middle" class="muted" font-size="15">task specialists</text>
      <text x="110" y="100" text-anchor="middle" class="soft mono" font-size="12">opt-in, no auto-spawn</text>
    </g>

    <g transform="translate(1050 178)">
      <rect class="node blue" width="220" height="120" rx="18"/>
      <text x="110" y="46" text-anchor="middle" class="ink" font-size="28" font-weight="850">7 hosts</text>
      <text x="110" y="76" text-anchor="middle" class="muted" font-size="15">Codex, Claude, more</text>
      <text x="110" y="100" text-anchor="middle" class="soft mono" font-size="12">custom host supported</text>
    </g>
    <g transform="translate(1050 330)">
      <rect class="node green" width="220" height="120" rx="18"/>
      <text x="110" y="46" text-anchor="middle" class="ink" font-size="28" font-weight="850">140 commands</text>
      <text x="110" y="76" text-anchor="middle" class="muted" font-size="15">CLI + slash shims</text>
      <text x="110" y="100" text-anchor="middle" class="soft mono" font-size="12">wb | lib | ps | auto</text>
    </g>
    <g transform="translate(1050 482)">
      <rect class="node violet" width="220" height="120" rx="18"/>
      <text x="110" y="46" text-anchor="middle" class="ink" font-size="28" font-weight="850">15 MCP tools</text>
      <text x="110" y="76" text-anchor="middle" class="muted" font-size="15">read-only defaults</text>
      <text x="110" y="100" text-anchor="middle" class="soft mono" font-size="12">route | index | proof</text>
    </g>
  </g>

  <g class="sans">
    <rect class="panel" x="468" y="168" width="464" height="84" rx="18"/>
    <text x="700" y="202" text-anchor="middle" class="ink" font-size="21" font-weight="820">Operator surfaces</text>
    <text x="700" y="230" text-anchor="middle" class="soft mono" font-size="13">vibe | lib | workflows | auto | wb | ps export</text>
    <path class="line" d="M700 252 V306"/>

    <rect class="panel" x="468" y="512" width="464" height="84" rx="18"/>
    <text x="700" y="546" text-anchor="middle" class="ink" font-size="21" font-weight="820">Local library</text>
    <text x="700" y="574" text-anchor="middle" class="soft mono" font-size="13">skillsforge-library.html | skillsforge-ai-index.html</text>
    <path class="line" d="M700 512 V458"/>

    <rect class="panel amber" x="468" y="620" width="464" height="54" rx="15"/>
    <text x="700" y="642" text-anchor="middle" class="ink" font-size="15" font-weight="800">Builder + validation + design depth</text>
    <text x="700" y="662" text-anchor="middle" class="muted" font-size="13">18 builder skills, 18 validation skills, 60 design skills, 22 PowerShell helpers</text>
  </g>
</svg>
