name: CI

on:
  push:
  pull_request:

jobs:
  validate-and-test:
    name: Validate, test, eval, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install package metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate skills
        run: npm run validate
      - name: Run tests
        run: npm test
      - name: Evaluate routing corpus
        run: npm run eval
      - name: Build packages and trust receipt
        run: npm run build
