<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SkillsForge Demo Video</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          "Segoe UI Variable Display", "Segoe UI", Arial, Helvetica, sans-serif;
        background: #05070b;
        color: #f5fbff;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          linear-gradient(115deg, transparent 0 28%, rgba(105, 255, 212, 0.14) 28.3% 28.8%, transparent 29.1%),
          linear-gradient(72deg, transparent 0 66%, rgba(75, 125, 255, 0.16) 66.2% 66.9%, transparent 67.2%),
          #05070b;
      }

      main {
        width: min(1120px, calc(100vw - 32px));
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(32px, 5vw, 64px);
        line-height: 1;
      }

      p {
        margin: 0 0 22px;
        color: #aab8c8;
        font-size: 18px;
        line-height: 1.45;
      }

      video {
        width: 100%;
        aspect-ratio: 16 / 9;
        display: block;
        border: 1px solid rgba(219, 255, 246, 0.18);
        border-radius: 18px;
        background: #000;
        box-shadow: 0 36px 120px rgba(0, 0, 0, 0.45);
      }

      code {
        color: #69ffd4;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SkillsForge Demo Video</h1>
      <p>
        Local preview for the committed 2:22 MP4: AI CLI development plugin,
        custom commands, local skill index, routing, workflows, and token-efficient
        operator tools. Upload
        <code>assets/video/skillsforge-demo.mp4</code> to YouTube for Devpost.
      </p>
      <video
        controls
        preload="metadata"
        poster="../assets/skillsforge-demo-poster.png"
        src="../assets/video/skillsforge-demo.mp4"
      ></video>
    </main>
  </body>
</html>
